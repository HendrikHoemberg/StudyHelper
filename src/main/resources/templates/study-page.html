<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Study Session')}">
    <link rel="stylesheet" th:href="@{/css/exam.css}">
</head>
<body>

<div class="app-layout">
    <nav th:replace="~{fragments/layout :: topnav}"></nav>
    <div id="main-content" class="app-main-content">
        <div class="sh-fade-in">
            <div class="sh-dashboard-shell">
                <div class="sh-explorer-shell">
                    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
                    <div id="explorer-detail" class="sh-explorer-detail sh-explorer-detail-content">
                        <div th:switch="${studyStateView}">
                            <div th:case="'card'" th:replace="~{fragments/study-card :: studyCard}"></div>
                            <div th:case="'question'" th:replace="~{fragments/quiz-question :: quizQuestion}"></div>
                            <div th:case="'complete'">
                                <div th:if="${mode == T(com.HendrikHoemberg.StudyHelper.dto.StudyMode).QUIZ}" th:replace="~{fragments/quiz-summary :: quizSummary}"></div>
                                <div th:if="${mode != T(com.HendrikHoemberg.StudyHelper.dto.StudyMode).QUIZ}" th:replace="~{fragments/study-complete :: studyComplete}"></div>
                            </div>
                            <div th:case="*" th:replace="~{fragments/study-setup :: studySetup}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('saved-session-discard-confirmed', function() {
    const form = document.querySelector('#study-setup-form, #wizard-form, form[data-study-setup]');
    if (!form) return;
    let input = form.querySelector('input[name="confirmDiscard"]');
    if (!input) {
        input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'confirmDiscard';
        input.value = 'true';
        form.appendChild(input);
    } else {
        input.value = 'true';
    }
    if (window.htmx) {
        window.htmx.trigger(form, 'submit');
    } else {
        form.requestSubmit();
    }
});
</script>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
