<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:fragment="quizSummary" id="quiz-session-content" class="sh-fade-in sh-study-session-active"
     data-celebrate="true" th:attr="data-score=${scorePercent}">

    <div class="sh-card sh-study-complete-card">
        <div class="sh-card-body">
            <h1 class="sh-page-title text-center mb-2" th:text="#{quiz.summary.title}">Test Complete</h1>

            <!-- Score hero -->
            <div class="sh-quiz-score-hero"
                 th:classappend="${scorePercent >= 80 ? ' sh-quiz-score-hero--good'
                                  : (scorePercent >= 60 ? ' sh-quiz-score-hero--warn'
                                     : ' sh-quiz-score-hero--bad')}">
                <div class="sh-quiz-score-value"
                     th:text="${correctCount} + '/' + ${totalQuestions}">0/0</div>
                <div class="sh-quiz-score-label" th:text="#{quiz.summary.percent-correct(${scorePercent})}">0% correct</div>
            </div>

            <!-- Question review -->
            <div class="sh-section-title mt-4" th:text="#{quiz.summary.review}">Review</div>
            <div class="sh-quiz-review-list">
                <div th:each="question, iter : ${questions}"
                     th:with="isCorrect=${correctFlags[iter.index]}"
                     class="sh-quiz-review-item"
                     th:classappend="${isCorrect ? ' sh-quiz-review-item--correct' : ' sh-quiz-review-item--wrong'}">

                    <div class="sh-quiz-review-header">
                        <span class="sh-quiz-review-num" th:text="#{quiz.summary.q-prefix(${iter.index + 1})}">Q1</span>
                        <span class="sh-quiz-review-question" th:text="${question.questionText}">Question</span>
                        <span class="sh-quiz-review-badge"
                               th:classappend="${isCorrect ? ' sh-quiz-review-badge--correct' : ' sh-quiz-review-badge--wrong'}">
                            <iconify-icon th:if="${isCorrect}" icon="lucide:check"></iconify-icon>
                            <iconify-icon th:unless="${isCorrect}" icon="lucide:x"></iconify-icon>
                        </span>
                    </div>

                    <div th:unless="${isCorrect}" class="sh-quiz-review-correct-ans">
                        <span th:text="${question.correctOptionIndices.size() > 1} ? #{quiz.summary.correct-answers-plural} : #{quiz.summary.correct-answers-singular}">Correct answer: </span>
                        <strong th:text="${correctAnswerTexts[iter.index]}">Answer</strong>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="sh-quiz-complete-actions">
                <a href="/study/start?mode=QUIZ" class="sh-btn sh-btn-primary"
                   hx-get="/study/start?mode=QUIZ" hx-target="#explorer-detail" hx-push-url="true">
                    <iconify-icon icon="lucide:rotate-ccw"></iconify-icon>
                    <span th:text="#{quiz.summary.new-quiz}">New Quiz</span>
                </a>
                <a href="/dashboard" class="sh-btn sh-btn-secondary"
                   hx-get="/dashboard" hx-target="#explorer-detail" hx-push-url="true">
                    <iconify-icon icon="lucide:layout-dashboard"></iconify-icon>
                    <span th:text="#{study.complete.back-to-dashboard}">Back to Dashboard</span>
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
