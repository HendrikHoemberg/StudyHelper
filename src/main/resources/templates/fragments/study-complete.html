<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:fragment="studyComplete" id="study-session-content" class="sh-fade-in sh-study-session-active"
     data-celebrate="true" th:attr="data-score=${stats.percentage}">

    <div th:if="${studyError}" class="sh-alert sh-alert-danger">
        <div class="sh-alert-body" th:text="${studyError}"></div>
        <button type="button" class="sh-alert-close" hx-on:click="this.closest('.sh-alert').remove()">
            <iconify-icon icon="lucide:x"></iconify-icon>
        </button>
    </div>

    <div class="sh-card sh-study-complete-card">
        <div class="sh-card-body">
            <h1 class="sh-page-title text-center mb-2" th:text="#{study.complete.title}">Session Complete</h1>
            <div class="sh-study-score-hero"
                 th:classappend="${stats.percentage >= 80 ? 'sh-study-score--good' : (stats.percentage >= 60 ? 'sh-study-score--warn' : 'sh-study-score--bad')}">
                <div class="sh-study-stat-label" th:text="#{study.complete.your-score}">Your Score</div>
                <div class="sh-study-stat-value" th:text="${stats.percentage} + '%'">0%</div>
            </div>

            <!-- Premium Stacked Distribution Bar -->
            <div class="sh-study-distribution-container mb-4">
                <h3 class="sh-study-distribution-title text-center mb-3" th:text="#{study.complete.distribution.title}">Grade Distribution</h3>
                <div class="sh-study-distribution-bar">
                    <div class="sh-dist-segment sh-dist--again" 
                         th:if="${stats.againCount > 0}"
                         th:style="'width: ' + ${stats.againPercent} + '%'" 
                         th:attr="data-percent=${stats.againPercent} + '%'"></div>
                    <div class="sh-dist-segment sh-dist--hard" 
                         th:if="${stats.hardCount > 0}"
                         th:style="'width: ' + ${stats.hardPercent} + '%'" 
                         th:attr="data-percent=${stats.hardPercent} + '%'"></div>
                    <div class="sh-dist-segment sh-dist--good" 
                         th:if="${stats.goodCount > 0}"
                         th:style="'width: ' + ${stats.goodPercent} + '%'" 
                         th:attr="data-percent=${stats.goodPercent} + '%'"></div>
                    <div class="sh-dist-segment sh-dist--easy" 
                         th:if="${stats.easyCount > 0}"
                         th:style="'width: ' + ${stats.easyPercent} + '%'" 
                         th:attr="data-percent=${stats.easyPercent} + '%'"></div>
                </div>
                <div class="sh-study-distribution-labels mt-3">
                    <div class="sh-dist-label sh-dist-label--again">
                        <span class="sh-dist-dot"></span>
                        <span class="sh-dist-text" th:text="#{study.grade.again}">Again</span>
                        <strong class="sh-dist-val" th:text="${stats.againCount}">0</strong>
                    </div>
                    <div class="sh-dist-label sh-dist-label--hard">
                        <span class="sh-dist-dot"></span>
                        <span class="sh-dist-text" th:text="#{study.grade.hard}">Hard</span>
                        <strong class="sh-dist-val" th:text="${stats.hardCount}">0</strong>
                    </div>
                    <div class="sh-dist-label sh-dist-label--good">
                        <span class="sh-dist-dot"></span>
                        <span class="sh-dist-text" th:text="#{study.grade.good}">Good</span>
                        <strong class="sh-dist-val" th:text="${stats.goodCount}">0</strong>
                    </div>
                    <div class="sh-dist-label sh-dist-label--easy">
                        <span class="sh-dist-dot"></span>
                        <span class="sh-dist-text" th:text="#{study.grade.easy}">Easy</span>
                        <strong class="sh-dist-val" th:text="${stats.easyCount}">0</strong>
                    </div>
                </div>
            </div>


            <div class="sh-study-complete-actions">
                <form th:if="${incorrectCardCount > 0}"
                      method="post"
                      hx-post="/session/redo-incorrect"
                      hx-target="#study-session-content"
                      hx-swap="outerHTML">
                    <button type="submit" class="sh-btn sh-btn-secondary">
                        <iconify-icon icon="lucide:x-circle"></iconify-icon>
                        <span th:text="#{study.complete.redo-incorrect(${incorrectCardCount})}">Redo Incorrect (0)</span>
                    </button>
                </form>
                <form method="post"
                      hx-post="/session/redo"
                      hx-target="#study-session-content"
                      hx-swap="outerHTML">
                    <button type="submit" class="sh-btn sh-btn-primary">
                        <iconify-icon icon="lucide:refresh-cw"></iconify-icon>
                        <span th:text="#{study.complete.redo-session}">Redo Session</span>
                    </button>
                </form>
                <a href="/study/start" class="sh-btn sh-btn-secondary"
                   hx-get="/study/start" hx-target="#explorer-detail" hx-push-url="true">
                    <iconify-icon icon="lucide:settings"></iconify-icon>
                    <span th:text="#{study.complete.reconfigure}">Reconfigure</span>
                </a>
                <a href="/dashboard" class="sh-btn sh-btn-secondary"
                   hx-get="/dashboard" hx-target="#explorer-detail" hx-push-url="true">
                    <iconify-icon icon="lucide:layout-dashboard"></iconify-icon>
                    <span th:text="#{study.complete.back-to-dashboard}">Back to Dashboard</span>
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
