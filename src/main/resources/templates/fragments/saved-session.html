<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- Dashboard "Continue session" card.
     Spans the full dashboard grid row above the library. -->
<section th:fragment="card" id="saved-session-card"
         th:if="${savedSession != null}"
         class="sh-saved-session-card">
    <div class="sh-saved-session-icon">
        <iconify-icon th:icon="${savedSession.type().name() == 'FLASHCARDS' ? 'lucide:book-open'
                              : savedSession.type().name() == 'QUIZ' ? 'lucide:list-checks'
                              : 'lucide:clipboard-list'}"></iconify-icon>
    </div>
    <div class="sh-saved-session-body">
        <div class="sh-saved-session-eyebrow">
            <span class="sh-saved-session-tag" th:text="${savedSession.type()}">FLASHCARDS</span>
            <span class="sh-saved-session-paused">Paused</span>
        </div>
        <div class="sh-saved-session-title" th:text="${savedSession.title()}">Title</div>
        <div class="sh-saved-session-progress" th:text="${savedSession.progressLabel()}">0 / 0 answered</div>
    </div>
    <div class="sh-saved-session-actions">
        <a class="sh-btn sh-btn-primary"
           th:href="@{${savedSession.resumeUrl()}}"
           th:attr="hx-get=@{${savedSession.resumeUrl()}}"
           hx-target="#explorer-detail"
           hx-push-url="true">
            <iconify-icon icon="lucide:play"></iconify-icon>
            Resume
        </a>
        <button type="button" class="sh-btn sh-btn-secondary"
                hx-post="/sessions/saved/discard"
                hx-target="#saved-session-card"
                hx-swap="outerHTML"
                hx-confirm="Discard this saved session? Your progress will be lost.">
            <iconify-icon icon="lucide:x"></iconify-icon>
            Discard
        </button>
    </div>
</section>

<!-- Empty replacement after discard. Keeps the id so a re-save can target it. -->
<div th:fragment="empty" id="saved-session-card" hidden></div>

<!-- Top-nav badge -->
<a th:fragment="navBadge"
   th:if="${savedSession != null}"
   class="topnav-link topnav-saved-badge"
   th:href="@{/sessions/saved/resume}"
   hx-get="/sessions/saved/resume"
   hx-target="#explorer-detail"
   hx-push-url="true"
   th:title="${savedSession.title() + ' — ' + savedSession.progressLabel()}">
    <span class="topnav-saved-badge-dot" aria-hidden="true"></span>
    <iconify-icon icon="lucide:bookmark"></iconify-icon>
    <span>Resume</span>
</a>

<!-- Conflict modal — included inline in the study wizard when a saved session exists.
     Self-removes via id; works both inline and when retargeted to #modal-placeholder. -->
<div th:fragment="conflict" class="sh-modal is-open" id="saved-session-conflict-modal" role="dialog" aria-modal="true">
    <div class="sh-modal-backdrop"
         onclick="document.getElementById('saved-session-conflict-modal')?.remove()"></div>
    <div class="sh-modal-dialog">
        <div class="sh-modal-content">
            <div class="sh-modal-header">
                <h5 class="sh-modal-title">Saved session in progress</h5>
                <button type="button" class="sh-modal-close" aria-label="Close"
                        onclick="document.getElementById('saved-session-conflict-modal')?.remove()">
                    <iconify-icon icon="lucide:x"></iconify-icon>
                </button>
            </div>
            <div class="sh-modal-body">
                <p style="margin:0;color:var(--text-muted);font-size:0.875rem;">
                    You already have a saved
                    <strong style="color:var(--text);text-transform:lowercase;"
                            th:text="${savedSession.type()}">flashcards</strong>
                    session. Resume it, or discard it and start a new one.
                </p>
                <div class="sh-saved-session-recap">
                    <div class="sh-saved-session-recap-title" th:text="${savedSession.title()}">Title</div>
                    <div class="sh-saved-session-recap-meta" th:text="${savedSession.progressLabel()}">0 / 0 answered</div>
                </div>
            </div>
            <div class="sh-modal-footer">
                <button type="button" class="sh-btn sh-btn-secondary"
                        onclick="document.getElementById('saved-session-conflict-modal')?.remove()">
                    Cancel
                </button>
                <button type="button" class="sh-btn sh-btn-danger"
                        hx-post="/sessions/saved/discard"
                        hx-target="#saved-session-conflict-modal"
                        hx-swap="outerHTML">
                    <iconify-icon icon="lucide:trash-2"></iconify-icon>
                    Discard &amp; start new
                </button>
                <a class="sh-btn sh-btn-primary"
                   th:href="@{${savedSession.resumeUrl()}}"
                   th:attr="hx-get=@{${savedSession.resumeUrl()}}"
                   hx-target="#explorer-detail"
                   hx-push-url="true">
                    <iconify-icon icon="lucide:play"></iconify-icon>
                    Resume
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
