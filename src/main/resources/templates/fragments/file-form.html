<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="uploadModal" class="sh-modal is-open">
    <div class="sh-modal-backdrop" onclick="this.closest('.sh-modal').remove()"></div>
    <div class="sh-modal-dialog">
        <div class="sh-modal-content">
            <div class="sh-modal-header">
                <h5 class="sh-modal-title">Upload File</h5>
                <button type="button" class="sh-modal-close" onclick="this.closest('.sh-modal').remove()">
                    <iconify-icon icon="lucide:x"></iconify-icon>
                </button>
            </div>
            <form th:action="@{/folders/{id}/files(id=${folderId})}" method="post"
                  enctype="multipart/form-data">
                <div class="sh-modal-body">
                    <div class="sh-upload-field">
                        <input type="file" name="file" id="upload-file-input" class="sh-upload-file-input" 
                               accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.gif,.webp" multiple required>
                        <button type="button" class="sh-upload-chooser" id="upload-file-chooser">
                            <iconify-icon icon="lucide:upload-cloud"></iconify-icon>
                            <span>Choose files</span>
                        </button>
                        <div class="sh-upload-selected" id="upload-selected-file">
                            <iconify-icon icon="lucide:check-circle" id="upload-status-icon"></iconify-icon>
                            <div class="sh-upload-file-name" id="upload-file-name">No file selected</div>
                        </div>
                        <div id="upload-error-message" style="display: none; color: #ff4d4f; margin-top: 8px; font-size: 0.875rem; align-items: center; gap: 4px;">
                            <iconify-icon icon="lucide:alert-circle"></iconify-icon>
                            <span>Unsupported file type selected. Allowed: .pdf, .txt, .md, .png, .jpg, .jpeg, .gif, .webp</span>
                        </div>
                    </div>
                    <p class="sh-upload-limit">Maximum file size: 100 MB</p>
                </div>
                <div class="sh-modal-footer">
                    <button type="button" class="sh-btn sh-btn-secondary" onclick="this.closest('.sh-modal').remove()">Cancel</button>
                    <button type="submit" class="sh-btn sh-btn-primary" id="upload-submit" disabled>Upload</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        (function() {
            initLucide();
            var fileInput = document.getElementById('upload-file-input');
            var chooser = document.getElementById('upload-file-chooser');
            var chooserText = chooser ? chooser.querySelector('span') : null;
            var selectedFileName = document.getElementById('upload-file-name');
            var selectedFile = document.getElementById('upload-selected-file');
            var submitButton = document.getElementById('upload-submit');
            var errorMsg = document.getElementById('upload-error-message');
            var statusIcon = document.getElementById('upload-status-icon');
            
            if (!fileInput || !chooser || !chooserText || !selectedFileName || !selectedFile || !submitButton || !errorMsg || !statusIcon) return;

            var allowedExtensions = ['.pdf', '.txt', '.md', '.png', '.jpg', '.jpeg', '.gif', '.webp'];

            chooser.addEventListener('click', function() {
                fileInput.click();
            });

            function updateUploadState() {
                var files = Array.prototype.slice.call(fileInput.files || []);
                var hasFile = files.length > 0;
                
                var invalidFiles = files.filter(function(file) {
                    var ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
                    return allowedExtensions.indexOf(ext) === -1;
                });
                
                var hasInvalidFiles = invalidFiles.length > 0;

                if (files.length === 1) {
                    selectedFileName.textContent = files[0].name;
                } else if (files.length > 1) {
                    selectedFileName.textContent = files.length + ' files selected: ' + files.map(function(file) {
                        return file.name;
                    }).join(', ');
                } else {
                    selectedFileName.textContent = 'No files selected';
                }
                
                selectedFile.classList.toggle('is-visible', hasFile);
                chooser.classList.toggle('is-selected', hasFile);
                chooserText.textContent = hasFile ? 'Change files' : 'Choose files';
                
                if (hasInvalidFiles) {
                    errorMsg.style.display = 'flex';
                    statusIcon.setAttribute('icon', 'lucide:alert-circle');
                    selectedFile.style.color = '#ff4d4f';
                    submitButton.disabled = true;
                } else {
                    errorMsg.style.display = 'none';
                    statusIcon.setAttribute('icon', 'lucide:check-circle');
                    selectedFile.style.color = '';
                    submitButton.disabled = !hasFile;
                }
            }

            fileInput.addEventListener('change', updateUploadState);
            updateUploadState();
        })();
    </script>
</div>

</body>
</html>
