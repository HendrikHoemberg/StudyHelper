# Study Tutorials
study.tutorial.how-it-works=How it works
study.tutorial.close=Close
study.tutorial.tips=Tips
study.tutorial.flashcards.p1=Each session surfaces the cards that are <strong>due</strong> today, plus up to a daily limit of new cards (20). Cards you already know are spaced further out and skipped until they come due.
study.tutorial.flashcards.p2=Tap the card to flip between the question and the answer.
study.tutorial.flashcards.p3=After revealing the answer, grade yourself with <strong>Again\u00a0/\u00a0Hard\u00a0/\u00a0Good\u00a0/\u00a0Easy</strong>. Each button previews when you\u2019ll next see the card (e.g. \u201cGood\u00a0\u00b7\u00a06d\u201d).
study.tutorial.flashcards.p4=<strong>Again</strong> re-queues the card later in the same session so you keep seeing it until it sticks; Hard, Good, and Easy schedule it for a future day and remove it from the session.
study.tutorial.flashcards.tip1=Grade honestly \u2014 the schedule only helps if it reflects what you actually recall.
study.tutorial.flashcards.tip2=Turn on the <strong>Practice</strong> toggle to run through cards without changing their schedule (good for last-minute cramming).
study.tutorial.quiz.p1=Pick the card decks you want to be quizzed on as the source.
study.tutorial.quiz.p2=The AI generates multiple-choice and true/false questions from the cards in those decks.
study.tutorial.quiz.p3=Answer each question and get immediate scoring as you go.
study.tutorial.quiz.p4=A summary at the end shows how you did.
study.tutorial.quiz.tip1=Selecting larger decks or multiple decks gives the AI more flashcards to draw varied questions from.
study.tutorial.quiz.tip2=Use it to check understanding quickly \u2014 it does not change your flashcard schedules.
study.tutorial.exam.p1=Choose your card decks, then answer <strong>long-form written</strong> questions in your own words.
study.tutorial.exam.p2=The AI grades your answers and returns a feedback report highlighting what was strong and what to improve.
study.tutorial.exam.tip1=Best for testing deeper understanding and explanation, not quick recall.
study.tutorial.exam.tip2=Like quizzes, exam performance does not affect your flashcard scheduling.
study.tutorial.study-dashboard.p1=Jump straight into configuring a study session with your choice of study modes: <strong>Flashcards</strong>, <strong>AI Quiz</strong>, or <strong>Exam</strong>.
study.tutorial.study-dashboard.p2=Customize options like question counts, AI guidelines, and study order before beginning your session.
study.tutorial.study-dashboard.p3=Track your correct and incorrect answers to automatically feed your progress back into the spaced repetition scheduler.
study.tutorial.study-dashboard.tip1=Select multiple decks or folders to study mixed content.
study.tutorial.study-dashboard.tip2=Use custom AI instructions if you want to quiz yourself on specific sub-topics or focus on a particular language.
study.tutorial.generator-dashboard.p1=Instantly build structured flashcard decks using advanced AI.
study.tutorial.generator-dashboard.p2=Upload documents (like PDF files), paste plain text notes, or capture/upload images.
study.tutorial.generator-dashboard.p3=The AI analyzes your material and generates relevant question-and-answer pairs, organizing them into a new deck.
study.tutorial.generator-dashboard.tip1=For PDFs, you can select specific pages to focus the generator on exactly what you need.
study.tutorial.generator-dashboard.tip2=Provide custom prompt instructions to guide the AI, such as \u201ccreate only high-level conceptual questions\u201d or \u201cgenerate definitions in French\u201d.
study.tutorial.due-dashboard.p1=Your daily spaced repetition queue. These are cards that the system has scheduled for review today based on your previous grades.
study.tutorial.due-dashboard.p2=Reviewing these cards daily is the most efficient way to achieve <strong>long-term mastery</strong> with minimal study time.
study.tutorial.due-dashboard.p3=Tap any card to flip it, then grade your recall honestly: <strong>Again / Hard / Good / Easy</strong>.
study.tutorial.due-dashboard.tip1=Keep your streak alive! Consistent daily practice helps solidify memories much better than cramming.
study.tutorial.due-dashboard.tip2=If you are all caught up, feel free to start a custom study session to review other material or preview new cards.

