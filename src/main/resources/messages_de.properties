# Study Tutorials
study.tutorial.how-it-works=So funktioniert es
study.tutorial.close=Schlie\u00dfen
study.tutorial.tips=Tipps
study.tutorial.flashcards.p1=Jede Sitzung zeigt die Karten, die heute <strong>f\u00e4llig</strong> sind, sowie bis zu 20 neue Karten pro Tag. Karten, die Sie schon gut kennen, werden weiter in die Zukunft geplant und erst wieder angezeigt, wenn sie f\u00e4llig sind.
study.tutorial.flashcards.p2=Tippen Sie auf die Karte, um zwischen Frage und Antwort umzubl\u00e4ttern.
study.tutorial.flashcards.p3=Nachdem Sie die Antwort aufgedeckt haben, bewerten Sie sich selbst mit <strong>Erneut\u00a0/\u00a0Schwer\u00a0/\u00a0Gut\u00a0/\u00a0Leicht</strong>. Jeder Button zeigt eine Vorschau, wann Sie die Karte als N\u00e4chstes sehen werden (z.\u00a0B. \u201eGut\u00a0\u00b7\u00a06d\u201c).
study.tutorial.flashcards.p4=<strong>Erneut</strong> bringt die Karte später in derselben Sitzung zurück, bis sie sitzt. Schwer, Gut und Leicht planen sie für einen späteren Tag ein und entfernen sie aus der aktuellen Sitzung.
study.tutorial.flashcards.tip1=Bewerten Sie ehrlich \u2014 der Lernplan hilft nur, wenn er widerspiegelt, was Sie wirklich abrufen können.
study.tutorial.flashcards.tip2=Aktivieren Sie den <strong>\u00dcbungsmodus</strong>, um Karten durchzugehen, ohne ihren Lernplan zu ändern. Praktisch fürs Last-Minute-Lernen.
study.tutorial.quiz.p1=Wählen Sie die Karteikarten-Decks aus, aus denen das Quiz erstellt werden soll.
study.tutorial.quiz.p2=Die KI generiert Multiple-Choice- und Wahr/Falsch-Fragen aus den Karten in diesen Decks.
study.tutorial.quiz.p3=Beantworten Sie die Fragen und sehen Sie direkt, ob Ihre Antwort richtig war.
study.tutorial.quiz.p4=Am Ende zeigt eine Zusammenfassung, wie gut Sie abgeschnitten haben.
study.tutorial.quiz.tip1=Die Auswahl größerer Decks oder mehrerer Decks hilft der KI, abwechslungsreichere Fragen zu erstellen.
study.tutorial.quiz.tip2=Nutzen Sie das Quiz, um Ihr Verständnis schnell zu prüfen. Ihre Karteikarten-Lernpläne bleiben unverändert.
study.tutorial.exam.p1=Wählen Sie Ihre Karteikarten-Decks aus und beantworten Sie danach <strong>ausführliche schriftliche</strong> Fragen in Ihren eigenen Worten.
study.tutorial.exam.p2=Die KI bewertet Ihre Antworten und erstellt einen Feedback-Bericht mit Stärken und Verbesserungsvorschlägen.
study.tutorial.exam.tip1=Am besten geeignet, um tieferes Verständnis und Erklärungsfähigkeit zu testen, nicht für schnelles Abfragen.
study.tutorial.exam.tip2=Wie beim Quiz beeinflusst die Prüfungsleistung Ihren Karteikarten-Lernplan nicht.
study.tutorial.study-dashboard.p1=Starten Sie direkt mit einer neuen Lernsitzung. Sie können zwischen <strong>Karteikarten</strong>, <strong>KI-Quiz</strong> und <strong>Prüfung</strong> wählen.
study.tutorial.study-dashboard.p2=Passen Sie Optionen wie Anzahl der Fragen, KI-Prompt und Lernreihenfolge an, bevor Sie starten.
study.tutorial.study-dashboard.p3=Ihre richtigen und falschen Antworten fließen automatisch in den Spaced-Repetition-Plan ein.
study.tutorial.study-dashboard.tip1=Wählen Sie mehrere Decks oder Ordner aus, um gemischte Inhalte zu lernen.
study.tutorial.study-dashboard.tip2=Nutzen Sie eigene KI-Prompts, wenn Sie sich zu bestimmten Unterthemen abfragen oder auf eine bestimmte Sprache konzentrieren möchten.
study.tutorial.generator-dashboard.p1=Erstellen Sie mit KI schnell strukturierte Karteikarten-Decks.
study.tutorial.generator-dashboard.p2=Laden Sie Dokumente wie PDFs hoch, fügen Sie Notizen als Text ein oder nutzen Sie Bilder.
study.tutorial.generator-dashboard.p3=Die KI analysiert Ihr Material und erstellt passende Frage-Antwort-Paare, die in einem neuen Deck organisiert werden.
study.tutorial.generator-dashboard.tip1=Bei PDFs können Sie bestimmte Seiten auswählen, damit der Generator genau den relevanten Abschnitt nutzt.
study.tutorial.generator-dashboard.tip2=Geben Sie eigene Prompts ein, um die KI zu steuern, z.\u00a0B. \u201enur konzeptionelle Fragen auf hohem Niveau erstellen\u201c oder \u201eDefinitionen auf Französisch generieren\u201c.
study.tutorial.generator-dashboard.tip3=Jeder Generierungs-Chunk zählt als 1 KI-Anfrage gegen Ihr Tageslimit. Das Schätzpanel zeigt die Gesamtzahl vor dem Start an.
study.tutorial.due-dashboard.p1=Ihre tägliche Spaced-Repetition-Queue. Das sind Karten, die das System anhand Ihrer bisherigen Bewertungen für heute eingeplant hat.
study.tutorial.due-dashboard.p2=Diese Karten täglich zu wiederholen ist der effizienteste Weg, Wissen <strong>langfristig zu behalten</strong>, ohne unnötig viel Zeit zu investieren.
study.tutorial.due-dashboard.p3=Tippen Sie auf eine Karte, um sie umzubl\u00e4ttern, und bewerten Sie dann ehrlich, wie gut Sie sich erinnern: <strong>Erneut / Schwer / Gut / Leicht</strong>.
study.tutorial.due-dashboard.tip1=Halten Sie Ihren Streak. Tägliches Üben festigt Wissen deutlich besser als kurzfristiges Lernen kurz vor der Prüfung.
study.tutorial.due-dashboard.tip2=Wenn alles erledigt ist, können Sie eine eigene Lernsitzung starten, um anderes Material zu wiederholen oder neue Karten vorab anzusehen.

