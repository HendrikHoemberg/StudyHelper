# Study Tutorials
study.tutorial.how-it-works=So funktioniert es
study.tutorial.close=Schlie\u00dfen
study.tutorial.tips=Tipps
study.tutorial.flashcards.p1=Jede Sitzung zeigt die Karten an, die heute <strong>f\u00e4llig</strong> sind, plus bis zu einem t\u00e4glichen Limit neuer Karten (20). Karten, die Sie bereits kennen, werden weiter hinausgez\u00f6gert und \u00fcbersprungen, bis sie f\u00e4llig werden.
study.tutorial.flashcards.p2=Tippen Sie auf die Karte, um zwischen Frage und Antwort umzubl\u00e4ttern.
study.tutorial.flashcards.p3=Nachdem Sie die Antwort aufgedeckt haben, bewerten Sie sich selbst mit <strong>Erneut\u00a0/\u00a0Schwer\u00a0/\u00a0Gut\u00a0/\u00a0Leicht</strong>. Jeder Button zeigt eine Vorschau, wann Sie die Karte als N\u00e4chstes sehen werden (z.\u00a0B. \u201eGut\u00a0\u00b7\u00a06d\u201c).
study.tutorial.flashcards.p4=<strong>Erneut</strong> stellt die Karte sp\u00e4ter in derselben Sitzung zur\u00fcck, sodass Sie sie so lange sehen, bis sie sitzt; Schwer, Gut und Leicht planen sie f\u00fcr einen zuk\u00fcnftigen Tag ein und entfernen sie aus der Sitzung.
study.tutorial.flashcards.tip1=Bewerten Sie ehrlich \u2014 der Zeitplan hilft nur, wenn er widerspiegelt, was Sie tats\u00e4chlich abrufen k\u00f6nnen.
study.tutorial.flashcards.tip2=Schalten Sie den <strong>\u00dcbungs</strong>-Modus ein, um Karten durchzugehen, ohne ihren Zeitplan zu \u00e4ndern (gut f\u00fcr Last-Minute-B\u00fcffeln).
study.tutorial.quiz.p1=W\u00e4hlen Sie die Stapel oder Dateien aus, die als Quelle f\u00fcr das Quiz dienen sollen.
study.tutorial.quiz.p2=Die KI generiert Multiple-Choice- und Wahr/Falsch-Fragen aus diesem Material.
study.tutorial.quiz.p3=Beantworten Sie jede Frage und erhalten Sie sofortige Bewertung w\u00e4hrend des Durchgangs.
study.tutorial.quiz.p4=Eine Zusammenfassung am Ende zeigt, wie Sie abgeschnitten haben.
study.tutorial.quiz.tip1=Mehr Quellmaterial gibt der KI mehr M\u00f6glichkeiten, abwechslungsreiche Fragen zu erstellen.
study.tutorial.quiz.tip2=Nutzen Sie es, um Ihr Verst\u00e4ndnis schnell zu \u00fcberpr\u00fcfen \u2014 es \u00e4ndert Ihre Karteikarten-Zeitpl\u00e4ne nicht.
study.tutorial.exam.p1=W\u00e4hlen Sie Ihr Material aus und beantworten Sie dann <strong>ausf\u00fchrliche schriftliche</strong> Fragen in Ihren eigenen Worten.
study.tutorial.exam.p2=Die KI bewertet Ihre Antworten und erstellt einen Feedback-Bericht, der hervorhebt, was gut war und was verbessert werden kann.
study.tutorial.exam.tip1=Am besten geeignet, um tieferes Verst\u00e4ndnis und Erkl\u00e4rungsf\u00e4higkeit zu testen, nicht f\u00fcr schnelles Abrufen.
study.tutorial.exam.tip2=Wie bei Quizzen beeinflusst die Pr\u00fcfungsleistung Ihre Karteikarten-Zeitplanung nicht.
study.tutorial.study-dashboard.p1=Starten Sie direkt mit der Konfiguration einer Lernsitzung mit Ihrer Wahl an Lernmodi: <strong>Karteikarten</strong>, <strong>KI-Quiz</strong> oder <strong>Pr\u00fcfung</strong>.
study.tutorial.study-dashboard.p2=Passen Sie Optionen wie Fragenanzahl, KI-Richtlinien und Lernreihenfolge an, bevor Sie Ihre Sitzung beginnen.
study.tutorial.study-dashboard.p3=Verfolgen Sie Ihre richtigen und falschen Antworten, um Ihren Fortschritt automatisch in den Spaced-Re petition-Planer einzuspeisen.
study.tutorial.study-dashboard.tip1=W\u00e4hlen Sie mehrere Stapel oder Ordner aus, um gemischte Inhalte zu lernen.
study.tutorial.study-dashboard.tip2=Verwenden Sie benutzerdefinierte KI-Anweisungen, wenn Sie sich zu bestimmten Unterthemen abfragen oder auf eine bestimmte Sprache konzentrieren m\u00f6chten.
study.tutorial.generator-dashboard.p1=Erstellen Sie sofort strukturierte Karteikartenstapel mit fortschrittlicher KI.
study.tutorial.generator-dashboard.p2=Laden Sie Dokumente (wie PDF-Dateien) hoch, f\u00fcgen Sie Notizen als Klartext ein oder erfassen/laden Sie Bilder hoch.
study.tutorial.generator-dashboard.p3=Die KI analysiert Ihr Material und generiert relevante Frage-Antwort-Paare, die in einem neuen Stapel organisiert werden.
study.tutorial.generator-dashboard.tip1=Bei PDFs k\u00f6nnen Sie bestimmte Seiten ausw\u00e4hlen, um den Generator genau auf das zu fokussieren, was Sie ben\u00f6tigen.
study.tutorial.generator-dashboard.tip2=Geben Sie benutzerdefinierte Prompt-Anweisungen, um die KI zu leiten, wie z.\u00a0B. \u201enur konzeptionelle Fragen auf hohem Niveau erstellen\u201c oder \u201eDefinitionen auf Franz\u00f6sisch generieren\u201c.
study.tutorial.due-dashboard.p1=Ihre t\u00e4gliche Spaced-Repetition-Warteschlange. Dies sind Karten, die das System basierend auf Ihren vorherigen Bewertungen f\u00fcr heute zur Wiederholung eingeplant hat.
study.tutorial.due-dashboard.p2=Das t\u00e4gliche Wiederholen dieser Karten ist der effizienteste Weg, um <strong>langfristige Meisterschaft</strong> mit minimalem Lernaufwand zu erreichen.
study.tutorial.due-dashboard.p3=Tippen Sie auf eine Karte, um sie umzubl\u00e4ttern, und bewerten Sie dann ehrlich, wie gut Sie sich erinnern: <strong>Erneut / Schwer / Gut / Leicht</strong>.
study.tutorial.due-dashboard.tip1=Halten Sie Ihre Serie am Leben! Kontinuierliches t\u00e4gliches \u00dcben hilft, Erinnerungen viel besser zu festigen als B\u00fcffeln.
study.tutorial.due-dashboard.tip2=Wenn Sie alles erledigt haben, k\u00f6nnen Sie gerne eine benutzerdefinierte Lernsitzung starten, um anderes Material zu wiederholen oder neue Karten anzusehen.

